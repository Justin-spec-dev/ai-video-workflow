services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/outputs:/app/outputs
      - ./backend/temp:/app/temp
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
      - OUTPUT_DIR=./outputs
      - MAX_CONCURRENCY=2
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
